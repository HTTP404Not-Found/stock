# nginx config for Fair Value Radar web (SPA)
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 啟用 gzip（API 與 SPA 都受惠）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback：所有找不到的 path 都回到 index.html，讓 react-router 接手
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不快 index.html，避免新版本部署後使用者仍拿到舊 bundle
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Vite build 出的 hash 檔名可永久快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 把 /api/* 反向代理到後端（容器內 DNS 名 `api`）
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 簡易 healthcheck
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
